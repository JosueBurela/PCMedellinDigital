<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Meteorologico - TV Loop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe.radar {
            width: 100%;
            height: 100%;
            border: none;
        }
        .youtube-loop {
            opacity: 0.01;
            position: absolute;
            pointer-events: none;
            bottom: 0;
            left: 0;
            width: 10px;
            height: 10px;
            z-index: -9999;
        }
    </style>
</head>
<body>
    <!-- Atlas Nacional de Riesgos (Monitoreo Secretario Publico) a pantalla completa (A traves del Proxy Interno) -->
    <iframe class="radar" src="/portal/MonitoreoSecretarioPublico/"></iframe>

    <!-- Truco anti-apagado: Video de Youtube silencioso en loop infinito -->
    <iframe class="youtube-loop" src="https://www.youtube.com/embed/g4mHPeMGTJM?autoplay=1&mute=1&loop=1&playlist=g4mHPeMGTJM" allow="autoplay"></iframe>
</body>
</html>
