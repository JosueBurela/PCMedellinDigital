version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api_local
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=MedellinPCSecretToken2026
      - AUTHENTICATION_TYPE=apikey
      
      # Configuración de Base de Datos para Prisma (Requerido para el inicio)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@db:5432/evolution?schema=public
      
      # Desactivar Redis/Cache (no tenemos contenedor Redis)
      - CACHE_REDIS_ENABLED=false
      - CACHE_REDIS_URI=
      - CACHE_LOCAL_ENABLED=true
      
      - WA_CONNECTION_AUTO_CLOSE=0
      - WA_CONNECTION_RECONNECT_ON_CLOSE=true
      - ALWAYS_ONLINE=true
    volumes:
      - evolution_instances:/evolution/instances
    restart: always

volumes:
  postgres_data:
  evolution_instances:
